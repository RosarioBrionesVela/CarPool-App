
name: Validate CarPool Documentation

on:
  push:
    paths:
      - 'README.md'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'README.md'
      - '.github/workflows/validate.yml'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Check README sections
        run: |
          grep -qi "Project Description" README.md
          grep -qi "Project Vision" README.md
          grep -qi "Team Members and Roles" README.md
          grep -qi "Project Objectives" README.md
          grep -qi "Workflow Rules" README.md
          grep -qi "Change Approval Process" README.md
          echo "CarPool documentation validated successfully!"
